<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASSGO - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/massgo.css" rel="stylesheet">
    <style>
        :root {
            --rosa-fuerte: #fe0c65;
            --amarillo-fuerte: #f1b81b;
            --fondo: #faf2cb;
            --texto-oscuro: #362922;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
        }

        /* ── PANEL IZQUIERDO — imagen de fondo ── */
        .panel-marca {
            flex: 0 0 45%;
            position: relative;
            overflow: hidden;
        }
        .panel-marca .bg-img {
            position: absolute;
            inset: 0;
            background-image: url('https://plus.unsplash.com/premium_photo-1681487791907-7013a2b375af?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center center;
        }
        /* Overlay muy sutil solo en la parte superior para el logo */
        .panel-marca .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.45) 0%,
                rgba(0,0,0,0.05) 35%,
                rgba(0,0,0,0) 60%
            );
        }
        .panel-marca .marca-contenido {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 28px 28px;
        }
        .marca-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .marca-logo .icono {
            width: 40px; height: 40px;
            background: var(--amarillo-fuerte);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: var(--texto-oscuro);
            flex-shrink: 0;
        }
        .marca-logo span {
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            letter-spacing: -0.3px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ── PANEL DERECHO — formulario ── */
        .panel-form {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: white;
        }
        .form-card {
            width: 100%;
            max-width: 400px;
        }
        .form-card h2 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--texto-oscuro);
            margin-bottom: 6px;
        }
        .form-card .subtitulo {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        /* Inputs */
        .campo-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            display: block;
        }
        .campo-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .campo-wrap .campo-icono {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 0.95rem;
            pointer-events: none;
        }
        .campo-input {
            width: 100%;
            border: 1.5px solid #e8e8e8;
            border-radius: 10px;
            padding: 12px 16px 12px 40px;
            font-size: 0.9rem;
            color: var(--texto-oscuro);
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .campo-input:focus {
            border-color: var(--rosa-fuerte);
            background: white;
            box-shadow: 0 0 0 3px rgba(254,12,101,0.08);
        }
        .campo-input.pe-5 { padding-right: 44px; }
        .btn-ojo {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: #bbb; cursor: pointer;
            font-size: 1rem; padding: 0;
            transition: color 0.2s;
        }
        .btn-ojo:hover { color: var(--rosa-fuerte); }

        /* Link olvidé contraseña */
        .link-olvide {
            display: block;
            text-align: right;
            font-size: 0.82rem;
            color: var(--rosa-fuerte);
            text-decoration: none;
            font-weight: 600;
            margin-top: -12px;
            margin-bottom: 24px;
        }
        .link-olvide:hover { text-decoration: underline; }

        /* Botón principal */
        .btn-ingresar {
            width: 100%;
            background: var(--rosa-fuerte);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .btn-ingresar:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }
        .btn-ingresar:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Divisor */
        .divisor {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #ccc;
            font-size: 0.82rem;
        }
        .divisor::before, .divisor::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        /* Registro link */
        .registro-link {
            text-align: center;
            font-size: 0.88rem;
            color: #666;
        }
        .registro-link a {
            color: var(--rosa-fuerte);
            font-weight: 700;
            text-decoration: none;
        }
        .registro-link a:hover { text-decoration: underline; }

        /* Volver */
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 28px;
            transition: color 0.2s;
        }
        .btn-volver:hover { color: var(--rosa-fuerte); }

        /* Error */
        .msg-error {
            background: #fff0f3;
            border: 1px solid #ffc0cb;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #c0392b;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg-error.show { display: flex; }

        /* Responsive */
        @media (max-width: 768px) {
            .panel-marca { display: none; }
            .panel-form { background: #f0f2f5; }
            .form-card {
                background: white;
                border-radius: 20px;
                padding: 32px 24px;
                box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            }
        }
    </style>
</head>
<body>

<!-- PANEL IZQUIERDO -->
<div class="panel-marca">
    <div class="bg-img"></div>
    <div class="bg-overlay"></div>
    <div class="marca-contenido">
        <div class="marca-logo">
            <div class="icono"><i class="bi bi-bag-fill"></i></div>
            <span>MASSGO</span>
        </div>
    </div>
</div>

<!-- PANEL DERECHO -->
<div class="panel-form">
    <div class="form-card">

        <a href="index.html" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>

        <h2>Bienvenido de vuelta</h2>
        <p class="subtitulo">Ingresa tus datos para continuar</p>

        <!-- Mensaje de error -->
        <div class="msg-error" id="msgError">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span id="msgErrorTxt">Credenciales incorrectas. Intenta de nuevo.</span>
        </div>

        <form id="formLogin" onsubmit="procesarLogin(event)">

            <!-- Email -->
            <label class="campo-label">Email o teléfono <span style="color:var(--rosa-fuerte);">*</span></label>
            <div class="campo-wrap">
                <i class="bi bi-envelope campo-icono"></i>
                <input type="text" id="inputEmail" class="campo-input"
                       placeholder="ejemplo@correo.com"
                       autocomplete="email" required>
            </div>

            <!-- Contraseña -->
            <label class="campo-label">Contraseña <span style="color:var(--rosa-fuerte);">*</span></label>
            <div class="campo-wrap">
                <i class="bi bi-lock campo-icono"></i>
                <input type="password" id="inputPass" class="campo-input pe-5"
                       placeholder="••••••••"
                       autocomplete="current-password" required>
                <button type="button" class="btn-ojo" onclick="togglePass('inputPass', this)">
                    <i class="bi bi-eye-slash"></i>
                </button>
            </div>

            <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn-ingresar" id="btnIngresar">
                Ingresar <i class="bi bi-arrow-right"></i>
            </button>

        </form>

        <div class="divisor">o</div>

        <p class="registro-link">
            ¿No tienes cuenta?
            <a href="registro.html">Crear cuenta gratis</a>
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/massgo.js"></script>
<script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye-slash';
        }
    }

    function procesarLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btnIngresar');
        const err = document.getElementById('msgError');

        // Simular carga
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Ingresando...';
        err.classList.remove('show');

        setTimeout(() => {
            // Simulación: cualquier email/pass es válido para el prototipo
            const email = document.getElementById('inputEmail').value.trim();
            if (email) {
                // Guardar sesión simulada
                localStorage.setItem('massgo_usuario', JSON.stringify({
                    nombre: email.split('@')[0],
                    email: email,
                    logueado: true
                }));
                // Redirigir al home
                window.location.href = 'index.html';
            } else {
                err.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Ingresar <i class="bi bi-arrow-right"></i>';
            }
        }, 1200);
    }
</script>
</body>
</html>
