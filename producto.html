<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASSGO - Detalle de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/massgo.css" rel="stylesheet">
    <style>
        .breadcrumb-massgo { padding: 12px 0; font-size: .9rem; }
        .breadcrumb-massgo a { color: var(--rosa-fuerte); text-decoration: none; font-weight: 600; }
        .breadcrumb-massgo span { color: #888; }

        .panel-imagen {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
            position: relative;
            min-height: 380px;
            display: flex; align-items: center; justify-content: center;
        }
        .panel-imagen img { max-height: 300px; max-width: 100%; object-fit: contain; }
        .badge-mas-vendido {
            position: absolute; top: 16px; left: 16px;
            background: linear-gradient(135deg, var(--rosa-fuerte), #ff4d8a);
            color: white; font-weight: 700; padding: 6px 16px;
            border-radius: 20px; font-size: .85rem;
        }
        .btn-favorito {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            background: white; border: 2px solid #eee;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all .3s; font-size: 1.1rem; color: #ccc;
        }
        .btn-favorito.activo { color: var(--rosa-fuerte); border-color: var(--rosa-fuerte); }
        .btn-favorito:hover { transform: scale(1.1); }

        .panel-info {
            background: linear-gradient(135deg, var(--rosa-pastel), #ffd6e7);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(254,12,101,.1);
        }
        .rating-badge { color: var(--amarillo-fuerte); font-weight: 700; font-size: 1rem; }
        .precio-grande { font-size: 2.4rem; font-weight: 900; color: var(--rosa-fuerte); }
        .precio-tachado { font-size: 1.1rem; color: #999; text-decoration: line-through; margin-left: 10px; }
        .stock-badge {
            background: var(--amarillo-fuerte); color: var(--texto-oscuro);
            font-weight: 700; padding: 5px 14px; border-radius: 20px; font-size: .85rem;
        }
        .stock-badge.sin-stock { background: #ff5252; color: white; }

        .control-cantidad {
            display: flex; align-items: center; gap: 0;
            background: white; border-radius: 30px;
            border: 2px solid #eee; overflow: hidden;
            width: fit-content;
        }
        .control-cantidad button {
            width: 40px; height: 40px; border: none; background: transparent;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            color: var(--texto-oscuro); transition: background .2s;
        }
        .control-cantidad button:hover { background: var(--rosa-pastel); }
        .control-cantidad span {
            min-width: 40px; text-align: center; font-weight: 700; font-size: 1.1rem;
        }

        .seccion-complementos { padding: 30px 0; }
        .card-complemento {
            background: linear-gradient(135deg, var(--celeste-claro), #b2ebf2);
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            transition: all .3s; cursor: pointer; border: 2px solid transparent;
        }
        .card-complemento:hover { transform: translateY(-5px); border-color: var(--celeste-fuerte); }
        .card-complemento .img-comp {
            height: 130px; display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        .card-complemento .img-comp img { max-height: 110px; max-width: 100%; object-fit: contain; }
        .card-complemento .info-comp { padding: 12px; }
        .card-complemento .nombre-comp { font-weight: 700; font-size: .9rem; color: var(--texto-oscuro); margin-bottom: 4px; }
        .card-complemento .precio-comp { font-weight: 800; color: var(--rosa-fuerte); font-size: 1.1rem; }
        .btn-comp-agregar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--rosa-fuerte); color: white; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem; cursor: pointer; transition: all .3s;
            flex-shrink: 0;
        }
        .btn-comp-agregar:hover { transform: scale(1.15); background: #e00a5a; }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 576px) {
            .breadcrumb-massgo { font-size: .78rem; padding: 8px 0; }

            /* Panel imagen: menos alto en mobile */
            .panel-imagen { min-height: 240px; padding: 20px; border-radius: 18px; }
            .panel-imagen img { max-height: 200px; }

            /* Panel info */
            .panel-info { padding: 20px 16px; border-radius: 18px; }
            .precio-grande { font-size: 1.8rem; }
            .precio-tachado { font-size: .95rem; }
            #nombreProducto { font-size: 1.4rem !important; }

            /* Control cantidad + botón: stack en mobile */
            .d-flex.align-items-center.gap-3.flex-wrap { gap: 10px !important; }
            .control-cantidad button { width: 44px; height: 44px; }
            .btn-massgo-primary.flex-grow-1 { padding: 13px 18px; font-size: .92rem; }

            /* Complementos */
            .seccion-complementos { padding: 16px 0; }
            .card-complemento .img-comp { height: 100px; }
            .card-complemento .nombre-comp { font-size: .8rem; }
            .card-complemento .precio-comp { font-size: .95rem; }
        }
    </style>
</head>
<body>

<!-- TOAST -->
<div class="alerta-massgo" id="alertaCarrito"></div>



<div class="container py-3">
    <!-- BREADCRUMB -->
    <div class="breadcrumb-massgo">
        <a href="index.html">Inicio</a>
        <span class="mx-2">›</span>
        <span id="breadCat">Categoría</span>
        <span class="mx-2">›</span>
        <strong id="breadNombre">Producto</strong>
    </div>

    <!-- DETALLE -->
    <div class="row g-4 mb-4">
        <!-- Imagen -->
        <div class="col-md-5">
            <div class="panel-imagen">
                <span class="badge-mas-vendido d-none" id="badgeMasVendido">
                    <i class="fas fa-fire me-1"></i> MÁS VENDIDO
                </span>
                <div class="btn-favorito" id="btnFavorito" onclick="toggleFavorito()">
                    <i class="far fa-heart"></i>
                </div>
                <img id="imgProducto" src="" alt="Producto">
            </div>
        </div>

        <!-- Info -->
        <div class="col-md-7">
            <div class="panel-info">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="rating-badge" id="ratingStars"></span>
                    <span class="text-muted" id="ratingNum" style="font-size:.9rem;"></span>
                </div>
                <h1 id="nombreProducto" style="font-size:2rem;font-weight:900;color:var(--texto-oscuro);line-height:1.2;margin-bottom:8px;"></h1>
                <p id="subtituloProducto" class="text-muted mb-3" style="font-size:.95rem;"></p>

                <div class="d-flex align-items-baseline mb-3">
                    <span class="precio-grande" id="precioProducto"></span>
                    <span class="precio-tachado" id="precioAntiguo"></span>
                </div>

                <div class="mb-3">
                    <strong>Descripción</strong>
                    <p id="descripcionProducto" class="mt-1 mb-0" style="font-size:.95rem;line-height:1.6;"></p>
                </div>

                <div class="d-flex align-items-center gap-3 mb-4 p-3 rounded-3" style="background:rgba(255,255,255,.6);">
                    <span style="font-size:.9rem;"><i class="fas fa-clock me-1" style="color:var(--rosa-fuerte);"></i> Disponibilidad</span>
                    <span class="ms-auto stock-badge" id="stockBadge"></span>
                </div>

                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <div class="control-cantidad">
                        <button onclick="cambiarCantidadLocal(-1)">−</button>
                        <span id="cantidadLocal">1</span>
                        <button onclick="cambiarCantidadLocal(1)">+</button>
                    </div>
                    <button class="btn-massgo-primary flex-grow-1" id="btnAgregar" onclick="agregarDesdeDetalle()">
                        <i class="fas fa-shopping-cart"></i> Añadir al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- COMPLEMENTOS -->
    <div class="seccion-complementos">
        <h3 style="font-size:1.4rem;font-weight:800;margin-bottom:20px;">
            Combina perfectamente con <span style="font-size:1.2rem;">✨</span>
        </h3>
        <div class="row g-3" id="gridComplementos"></div>
    </div>
</div>

<!-- CHATBOT -->
<div class="chatbot-btn" title="Asistente MassGo"><i class="bi bi-robot"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/massgo.js"></script>
<script src="js/api.js"></script>
<script src="js/navbar.js"></script>
<script>
    let cantidadLocal = 1;
    let productoActual = null;
    let favorito = false;

    /* ── Busca en PRODUCTOS locales y en CATALOGO_EXTENDIDO ── */
    function buscarProductoPorId(id) {
        // Buscar en productos locales (massgo.js)
        const local = PRODUCTOS.find(x => x.id === id);
        if (local) return { ...local, imagen: local.imagen, resenas: local.reseñas };

        // Buscar en catálogo extendido (api.js)
        const ext = CATALOGO_EXTENDIDO.find(x => x.id === id);
        if (ext) {
            return {
                id: ext.id,
                nombre: ext.nombre,
                descripcion: ext.descripcion,
                precio: ext.precio,
                precioAntiguo: ext.ant,
                descuento: ext.descuento,
                imagen: ext.img,
                categoria: ext.cat,
                stock: ext.stock,
                rating: ext.rating,
                resenas: ext.resenas,
                badge: ext.descuento > 0 ? 'OFERTA' : null,
                complementos: _sugerirComplementos(ext)
            };
        }
        return null;
    }

    /* ── Sugiere complementos de la misma categoría ── */
    function _sugerirComplementos(prod) {
        const mismasCat = CATALOGO_EXTENDIDO
            .filter(x => x.cat === prod.cat && x.id !== prod.id)
            .slice(0, 4)
            .map(x => x.id);
        if (mismasCat.length > 0) return mismasCat;
        // Fallback: primeros 4 de PRODUCTOS locales
        return PRODUCTOS.slice(0, 4).map(p => p.id);
    }

    function getIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id')) || 1;
    }

    function renderEstrellas(rating) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (rating >= i)            html += '<i class="fas fa-star"></i>';
            else if (rating >= i - 0.5) html += '<i class="fas fa-star-half-alt"></i>';
            else                        html += '<i class="far fa-star"></i>';
        }
        return html;
    }

    function cargarProducto() {
        const id = getIdFromURL();
        const p  = buscarProductoPorId(id);
        if (!p) { window.location.href = 'index.html'; return; }
        productoActual = p;

        document.title = `MASSGO - ${p.nombre}`;
        document.getElementById('breadCat').textContent    = p.categoria;
        document.getElementById('breadNombre').textContent = p.nombre;
        document.getElementById('imgProducto').src         = p.imagen;
        document.getElementById('imgProducto').alt         = p.nombre;
        document.getElementById('nombreProducto').textContent    = p.nombre;
        document.getElementById('subtituloProducto').textContent = p.categoria + ' · ' + (p.stock > 0 ? 'Disponible' : 'Sin stock');
        document.getElementById('descripcionProducto').textContent = p.descripcion;
        document.getElementById('precioProducto').textContent = `S/ ${p.precio.toFixed(2)}`;
        document.getElementById('ratingStars').innerHTML = renderEstrellas(p.rating);
        document.getElementById('ratingNum').textContent = `${p.rating} (${p.resenas || p.reseñas || 0} reseñas)`;

        if (p.precioAntiguo) {
            document.getElementById('precioAntiguo').textContent = `S/ ${p.precioAntiguo.toFixed(2)}`;
        }

        if (p.badge === 'MÁS VENDIDO') {
            document.getElementById('badgeMasVendido').classList.remove('d-none');
        }

        const stockEl = document.getElementById('stockBadge');
        if (p.stock === 0) {
            stockEl.textContent = 'Sin stock';
            stockEl.classList.add('sin-stock');
            document.getElementById('btnAgregar').disabled = true;
            document.getElementById('btnAgregar').style.background = '#ccc';
        } else {
            stockEl.textContent = `${p.stock} en stock`;
        }

        cargarComplementos(p.complementos || []);
    }

    function cargarComplementos(ids) {
        const grid = document.getElementById('gridComplementos');
        const lista = ids
            .map(id => buscarProductoPorId(id))
            .filter(Boolean);

        if (lista.length === 0) {
            grid.innerHTML = '<p class="text-muted">No hay complementos disponibles.</p>';
            return;
        }
        grid.innerHTML = lista.map(p => `
            <div class="col-6 col-md-3">
                <div class="card-complemento" onclick="window.location.href='producto.html?id=${p.id}'">
                    <div class="img-comp">
                        <img src="${p.imagen}" alt="${p.nombre}" loading="lazy"
                             onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=300&h=300&fit=crop'">
                    </div>
                    <div class="info-comp d-flex align-items-center justify-content-between">
                        <div>
                            <div class="nombre-comp">${p.nombre}</div>
                            <div class="precio-comp">S/ ${p.precio.toFixed(2)}</div>
                        </div>
                        <button class="btn-comp-agregar" onclick="event.stopPropagation(); agregarAlCarrito(${p.id})">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function cambiarCantidadLocal(delta) {
        cantidadLocal = Math.max(1, cantidadLocal + delta);
        document.getElementById('cantidadLocal').textContent = cantidadLocal;
    }

    function agregarDesdeDetalle() {
        if (!productoActual) return;
        agregarAlCarrito(productoActual.id, cantidadLocal);
    }

    function toggleFavorito() {
        favorito = !favorito;
        const btn = document.getElementById('btnFavorito');
        btn.innerHTML = favorito ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>';
        btn.classList.toggle('activo', favorito);
        mostrarToast(favorito ? 'Agregado a favoritos ❤️' : 'Eliminado de favoritos');
    }

    cargarProducto();
</script>
</body>
</html>
