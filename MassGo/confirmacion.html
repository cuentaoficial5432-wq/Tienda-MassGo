<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASSGO - ¡Pedido Confirmado!</title>
    <link rel="icon" type="image/png" sizes="96x96" href="img/favicon-96x96.png">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="MASSGO">
    <meta name="theme-color" content="#fe0c65">
    <link rel="manifest" href="manifest.json">
    <meta property="og:title" content="MASSGO - Supermercado de Barrio en tu Bolsillo">
    <meta property="og:description" content="Compra desde tu celular y recibe en menos de 30 minutos.">
    <meta property="og:image" content="img/icon-512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/massgo.css" rel="stylesheet">
    <link href="css/chatbot.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; min-height: 100vh; }

        .navbar-simple {
            display: none; /* reemplazado por navbar.js */
        }

        .contenedor-confirmacion {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 30px 16px;
        }

        .ticket {
            background: var(--amarillo-suave);
            border: 2px solid var(--amarillo-fuerte);
            border-radius: 28px;
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
            animation: fadeInUp .6s ease;
        }

        /* Efecto ticket con muescas laterales */
        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #d4f4ff, #ffd6e7);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .ticket::before { left: -14px; }
        .ticket::after  { right: -14px; }

        .icono-check {
            width: 72px; height: 72px; border-radius: 50%;
            background: #4caf50; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin: 0 auto 20px;
            box-shadow: 0 6px 20px rgba(76,175,80,.4);
            animation: popIn .5s ease .3s both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .titulo-confirmado { font-size: 2rem; font-weight: 900; text-align: center; color: var(--texto-oscuro); margin-bottom: 8px; }
        .subtitulo-confirmado { text-align: center; color: #666; font-size: .95rem; margin-bottom: 28px; }

        .linea-divisoria {
            border: none;
            border-top: 2px dashed #ddd;
            margin: 20px 0;
        }

        .dato-pedido {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,.06);
        }
        .dato-pedido:last-child { border-bottom: none; }
        .dato-label { font-size: .8rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; }
        .dato-valor { font-weight: 700; font-size: .95rem; color: var(--texto-oscuro); }

        .badge-numero { background: var(--texto-oscuro); color: white; border-radius: 20px; padding: 6px 16px; font-weight: 700; font-size: .95rem; }
        .badge-estado { background: var(--celeste-fuerte); color: white; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: .85rem; display: flex; align-items: center; gap: 6px; }
        .badge-estado .punto { width: 8px; height: 8px; border-radius: 50%; background: white; animation: pulse 1.5s infinite; }
        .badge-tiempo { background: white; border: 2px solid #eee; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: .85rem; color: var(--texto-oscuro); display: flex; align-items: center; gap: 6px; }
        .badge-tiempo i { color: var(--rosa-fuerte); }

        .btn-seguimiento {
            width: 100%; padding: 16px; border-radius: 30px; margin-top: 24px;
            background: linear-gradient(135deg, var(--rosa-fuerte), #ff4d8a);
            color: white; border: none; font-weight: 700; font-size: 1.05rem;
            cursor: pointer; transition: all .3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-seguimiento:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(254,12,101,.4); }

        .btn-catalogo {
            width: 100%; padding: 14px; border-radius: 30px; margin-top: 12px;
            background: white; color: var(--texto-oscuro);
            border: 2px solid #ddd; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all .3s;
        }
        .btn-catalogo:hover { border-color: var(--rosa-fuerte); color: var(--rosa-fuerte); }

        /* ── RESPONSIVE MOBILE ── */
        @media (max-width: 576px) {
            .contenedor-confirmacion { padding: 16px 12px 80px; align-items: flex-start; }
            .ticket { padding: 28px 20px; border-radius: 20px; }
            /* Ocultar muescas en mobile (se salen del viewport) */
            .ticket::before, .ticket::after { display: none; }
            .icono-check { width: 60px; height: 60px; font-size: 1.6rem; }
            .titulo-confirmado { font-size: 1.5rem; }
            .subtitulo-confirmado { font-size: .85rem; }
            .dato-label { font-size: .72rem; }
            .dato-valor { font-size: .88rem; }
            .badge-numero { font-size: .82rem; padding: 5px 12px; }
            .badge-estado { font-size: .78rem; padding: 5px 10px; }
            .badge-tiempo { font-size: .78rem; padding: 5px 10px; }
            .btn-seguimiento { padding: 14px; font-size: .95rem; }
            .btn-catalogo { padding: 12px; font-size: .9rem; }
        }
    </style>
</head>
<body>

<!-- NAVBAR (inyectado por navbar.js) -->

<div class="contenedor-confirmacion">
    <div class="ticket">
        <!-- Check animado -->
        <div class="icono-check">
            <i class="fas fa-check"></i>
        </div>

        <h1 class="titulo-confirmado">¡Pedido Confirmado!</h1>
        <p class="subtitulo-confirmado">Tu compra se ha procesado con éxito y ya estamos preparando tu pedido.</p>

        <hr class="linea-divisoria">

        <div class="dato-pedido">
            <span class="dato-label">Número de pedido</span>
            <span class="badge-numero" id="numeroPedido">#MG-0000000</span>
        </div>

        <div class="dato-pedido">
            <span class="dato-label">Estado</span>
            <span class="badge-estado">
                <span class="punto"></span>
                En preparación
            </span>
        </div>

        <div class="dato-pedido">
            <span class="dato-label">Tiempo estimado</span>
            <span class="badge-tiempo">
                <i class="fas fa-clock"></i>
                <span id="tiempoEstimado">15 - 20 min</span>
            </span>
        </div>

        <div class="dato-pedido">
            <span class="dato-label">Total pagado</span>
            <span class="dato-valor" id="totalPagado" style="color:var(--rosa-fuerte);font-size:1.1rem;">S/ 0.00</span>
        </div>

        <div class="dato-pedido">
            <span class="dato-label">Entrega en</span>
            <span class="dato-valor" id="direccionEntrega" style="font-size:.85rem;text-align:right;max-width:60%;">—</span>
        </div>

        <button class="btn-seguimiento" onclick="verSeguimiento()">
            Ver seguimiento del pedido <i class="fas fa-map-marker-alt"></i>
        </button>
        <button class="btn-catalogo" onclick="window.location.href='index.html'">
            Volver al catálogo
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/massgo.js"></script>
<script src="js/navbar.js"></script>
<script>
    function cargarConfirmacion() {
        const pedidoStr = localStorage.getItem('massgo_pedido');
        if (!pedidoStr) { window.location.href = 'index.html'; return; }
        const pedido = JSON.parse(pedidoStr);

        document.getElementById('numeroPedido').textContent = pedido.numero;
        document.getElementById('totalPagado').textContent = `S/ ${pedido.total.toFixed(2)}`;
        document.getElementById('direccionEntrega').textContent = pedido.direccion || '—';
        document.getElementById('tiempoEstimado').textContent = pedido.tipoEntrega === 'express' ? '15 - 20 min' : 'Según horario programado';

        // Limpiar carrito después de confirmar
        vaciarCarrito();
    }

    function verSeguimiento() {
        window.location.href = 'seguimiento.html';
    }

    cargarConfirmacion();
</script>
<script src="js/chatbot.js"></script>
</body>
</html>
